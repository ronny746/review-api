<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Share Your Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #6b7280;
            font-size: 16px;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 10px;
        }

        .error-text {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
        }

        .business-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .business-avatar {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin: 0 auto 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .business-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .business-location {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .business-category {
            font-size: 12px;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .rating-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .rating-label {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
        }

        .rating-instruction {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .star {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .star:hover,
        .star:active {
            transform: scale(1.1);
            background: #fef3c7;
            border-color: #fbbf24;
        }

        .star.selected {
            background: #fbbf24;
            border-color: #f59e0b;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }

        .star::before {
            content: '★';
            font-size: 28px;
            color: #d1d5db;
            transition: color 0.3s ease;
        }

        .star.selected::before,
        .star:hover::before {
            color: white;
        }

        .rating-text {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            min-height: 24px;
        }

        .feedback-form {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .feedback-form.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover,
        .submit-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .message.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .redirect-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .redirect-message {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .redirect-overlay.show .redirect-message {
            transform: scale(1);
        }

        .redirect-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .redirect-title {
            font-size: 20px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
        }

        .redirect-text {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .countdown {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* iOS specific styles */
        @supports (-webkit-touch-callout: none) {
            .star {
                -webkit-tap-highlight-color: transparent;
            }
            
            .form-input {
                -webkit-appearance: none;
                border-radius: 12px;
            }
            
            .submit-btn {
                -webkit-appearance: none;
                border-radius: 12px;
            }
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
                margin: 10px;
            }
            
            .stars {
                gap: 6px;
            }
            
            .star {
                width: 45px;
                height: 45px;
            }
            
            .star::before {
                font-size: 24px;
            }
        }

        .content {
            display: none;
        }

        .content.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading business details...</div>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState" style="display: none;">
            <div class="error-icon">❌</div>
            <div class="error-title">Business Not Found</div>
            <div class="error-text" id="errorMessage">Unable to load business information</div>
            <button class="retry-btn" onclick="location.reload()">Retry</button>
        </div>

        <!-- Main Content -->
        <div class="content" id="mainContent">
            <div class="header">
                <h1 class="title">Share Your Experience</h1>
                <p class="subtitle">We value your feedback</p>
            </div>

            <div class="business-info" id="businessInfo">
                <div class="business-avatar" id="businessAvatar">
                    Loading...
                </div>
                <div class="business-name" id="businessName">Loading...</div>
                <div class="business-location" id="businessLocation">Please wait...</div>
                <div class="business-category" id="businessCategory"></div>
            </div>

            <div class="rating-section">
                <div class="rating-label">Rate Your Experience</div>
                <div class="rating-instruction">Click on the stars to rate</div>
                
                <div class="stars" id="starsContainer">
                    <div class="star" data-rating="1"></div>
                    <div class="star" data-rating="2"></div>
                    <div class="star" data-rating="3"></div>
                    <div class="star" data-rating="4"></div>
                    <div class="star" data-rating="5"></div>
                </div>
                
                <div class="rating-text" id="ratingText">Select your rating</div>
            </div>

            <div class="feedback-form" id="feedbackForm">
                <form id="reviewForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="note">Note</label>
                        <textarea id="note" class="form-input form-textarea" placeholder="Tell us about your experience..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span id="submitText">Submit Feedback</span>
                    </button>

                    <div id="messageContainer"></div>
                </form>
            </div>
        </div>
    </div>

    <div class="redirect-overlay" id="redirectOverlay">
        <div class="redirect-message">
            <div class="redirect-icon">⭐</div>
            <div class="redirect-title">Thank You!</div>
            <div class="redirect-text">Redirecting to review platform...</div>
            <div class="countdown">
                <div class="loading"></div>
                <span id="countdownText">3</span>
            </div>
        </div>
    </div>

    <script>
        class ReviewForm {
            constructor() {
                this.currentRating = 0;
                this.businessData = null;
                this.businessId = null;
                this.init();
            }

            init() {
                this.extractBusinessId();
                this.loadBusinessData();
            }

            extractBusinessId() {
                // Extract business ID from URL path
                const pathParts = window.location.pathname.split('/');
                this.businessId = pathParts[pathParts.length - 1] || '';
                
                // Also check URL parameters as fallback
                const urlParams = new URLSearchParams(window.location.search);
                if (!this.businessId && urlParams.get('id')) {
                    this.businessId = urlParams.get('id');
                }

                if (!this.businessId) {
                    this.showError('Invalid business ID in URL');
                    return;
                }
            }

            async loadBusinessData() {
                try {
                    this.showLoading();

                    const response = await fetch(`/api/business/${this.businessId}`);
                    
                    if (!response.ok) {
                        throw new Error('Business not found');
                    }

                    this.businessData = await response.json();
                    this.displayBusinessInfo();
                    this.setupStarRating();
                    this.setupForm();
                    this.showContent();

                } catch (error) {
                    this.showError(error.message || 'Failed to load business information');
                }
            }

            displayBusinessInfo() {
                const { businessData } = this;
                
                // Update business name
                document.getElementById('businessName').textContent = 
                    businessData.businessName || 'Business';
                
                // Update business location
                const locationParts = [
                    businessData.businessAddress,
                    businessData.businessCity,
                    businessData.businessState
                ].filter(Boolean);
                
                document.getElementById('businessLocation').textContent = 
                    locationParts.join(', ') || 'Location not available';
                
                // Update business category
                const categoryElement = document.getElementById('businessCategory');
                if (businessData.businessCategory) {
                    categoryElement.textContent = businessData.businessCategory;
                    categoryElement.style.display = 'inline-block';
                } else {
                    categoryElement.style.display = 'none';
                }

                // Update business avatar
                const avatarElement = document.getElementById('businessAvatar');
                if (businessData.businessPhoto) {
                    const imgSrc = businessData.businessPhoto.startsWith('data:') 
                        ? businessData.businessPhoto 
                        : `data:image/jpeg;base64,${businessData.businessPhoto}`;
                    
                    avatarElement.innerHTML = `<img src="${imgSrc}" alt="Business Photo" />`;
                } else {
                    // Create initials from business name
                    const initials = businessData.businessName 
                        ? businessData.businessName.split(' ')
                            .slice(0, 2)
                            .map(word => word[0])
                            .join('')
                            .toUpperCase()
                        : 'BIZ';
                    
                    avatarElement.textContent = initials;
                }
            }

            setupStarRating() {
                const stars = document.querySelectorAll('.star');
                const ratingText = document.getElementById('ratingText');

                const ratingTexts = {
                    1: 'Poor 😔',
                    2: 'Fair 😐', 
                    3: 'Good 🙂',
                    4: 'Very Good 😊',
                    5: 'Excellent! 🌟'
                };

                stars.forEach((star, index) => {
                    star.addEventListener('click', (e) => {
                        e.preventDefault();
                        const rating = parseInt(star.dataset.rating);
                        this.setRating(rating);
                    });

                    // Touch events for better mobile experience
                    star.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                    });

                    star.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        const rating = parseInt(star.dataset.rating);
                        this.setRating(rating);
                    });
                });

                const updateStars = (rating) => {
                    stars.forEach((star, index) => {
                        star.classList.toggle('selected', index < rating);
                    });
                    ratingText.textContent = rating > 0 ? ratingTexts[rating] : 'Select your rating';
                };

                this.updateStars = updateStars;
            }

            setRating(rating) {
                this.currentRating = rating;
                this.updateStars(rating);

                if (rating >= 4) {
                    // High rating: redirect to review platform
                    this.redirectToReview();
                } else {
                    // Low rating: show feedback form
                    this.showFeedbackForm();
                }
            }

            redirectToReview() {
                const reviewLink = this.businessData?.businessReviewLink;
                
                if (!reviewLink || reviewLink === '#') {
                    this.showMessage('Review link not available for this business', 'error');
                    return;
                }

                const overlay = document.getElementById('redirectOverlay');
                const countdownElement = document.getElementById('countdownText');
                
                overlay.classList.add('show');
                
                let countdown = 3;
                const interval = setInterval(() => {
                    countdown--;
                    countdownElement.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(interval);
                        // Redirect in same window
                        window.location.href = reviewLink;
                    }
                }, 1000);
            }

            showFeedbackForm() {
                const form = document.getElementById('feedbackForm');
                form.classList.add('show');
                
                // Smooth scroll to form
                setTimeout(() => {
                    form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 200);
            }

            setupForm() {
                const form = document.getElementById('reviewForm');
                
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const name = document.getElementById('name').value.trim();
                    const phone = document.getElementById('phone').value.trim();
                    const note = document.getElementById('note').value.trim();

                    // Validation
                    if (!name || name.length < 2) {
                        this.showMessage('Please enter a valid name (minimum 2 characters)', 'error');
                        return;
                    }

                    if (!phone || phone.length < 6) {
                        this.showMessage('Please enter a valid phone number', 'error');
                        return;
                    }

                    if (!note || note.length < 5) {
                        this.showMessage('Please write some feedback (minimum 5 characters)', 'error');
                        return;
                    }

                    // Submit feedback
                    await this.submitFeedback({
                        businessId: this.businessId,
                        name,
                        phone,
                        note,
                        rating: this.currentRating
                    });
                });
            }

            async submitFeedback(data) {
                const submitBtn = document.getElementById('submitBtn');
                const submitText = document.getElementById('submitText');

                try {
                    submitBtn.disabled = true;
                    submitText.innerHTML = '<div class="loading"></div>Submitting...';

                    const response = await fetch('/api/review/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to submit review');
                    }

                    this.showMessage('Thank you for your feedback! 🎉', 'success');
                    document.getElementById('reviewForm').reset();
                    this.currentRating = 0;
                    this.updateStars(0);
                    
                    // Hide form after success
                    setTimeout(() => {
                        document.getElementById('feedbackForm').classList.remove('show');
                    }, 2000);

                } catch (error) {
                    this.showMessage(error.message || 'Error submitting feedback. Please try again.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitText.textContent = 'Submit Feedback';
                }
            }

            showLoading() {
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('errorState').style.display = 'none';
                document.getElementById('mainContent').classList.remove('show');
            }

            showError(message) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMessage').textContent = message;
                document.getElementById('mainContent').classList.remove('show');
            }

            showContent() {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'none';
                document.getElementById('mainContent').classList.add('show');
            }

            showMessage(message, type) {
                const messageContainer = document.getElementById('messageContainer');
                messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => {
                        messageContainer.innerHTML = '';
                    }, 5000);
                }
            }
        }

        // Initialize the form when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ReviewForm();
        });

        // Prevent zoom on input focus (iOS)
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
